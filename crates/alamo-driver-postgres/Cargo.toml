[package]
name = "alamo-driver-postgres"
description = "Alamo PostgreSQL driver: decoding from the protocol to the columnar layout."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
alamo-core.workspace = true
tokio-postgres = "0.7"
tokio = { workspace = true, features = ["rt", "net", "time", "sync", "macros"] }
futures-util = { workspace = true, features = ["std"] }
tokio-postgres-rustls = { version = "0.14.0", features = ["ring"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.4"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
