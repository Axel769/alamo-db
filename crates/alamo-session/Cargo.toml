[package]
name = "alamo-session"
description = "Alamo sessions: result set registry, streaming execution, cancellation, memory budget."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
alamo-core.workspace = true
alamo-driver-postgres.workspace = true
alamo-driver-mysql.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
tokio-postgres = { workspace = true }
futures-util = { workspace = true, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
tokio-postgres-rustls = { version = "0.14.0", features = ["ring"] }
# Certificate summaries (§12.2): both already in the tree through
# tokio-postgres-rustls, no new crate.
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
rustls-pki-types = { version = "1", features = ["std"] }
# Encrypted client certificate keys (mTLS, §12.3): already in the tree
# through russh, with the same features.
pkcs8 = { version = "0.11", default-features = false, features = ["encryption", "pem", "std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
