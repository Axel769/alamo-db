[package]
name = "alamo-bench"
description = "M0 validation spike: measures the socket -> columnar pipeline without a webview."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "alamo-bench"
path = "src/main.rs"

[dependencies]
alamo-core.workspace = true
alamo-driver-postgres.workspace = true
alamo-session.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
clap.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
